# ==========================================================
# Application Configuration
# ==========================================================
server:
  port: ${PORT:8080}

spring:
  application:
    name: ott-streaming-backend

  # ========================================================
  # PostgreSQL Database Connection (Neon DB)
  # ========================================================
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-rough-block-b397ujw6.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
    username: ${DB_USERNAME:neondb_owner}
    password: ${DB_PASSWORD:npg_fBdLUxir1jk7}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 30000
      max-lifetime: 240000
      connection-timeout: 20000

  # ========================================================
  # Flyway Database Migration
  # ========================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # ========================================================
  # JPA / Hibernate
  # ========================================================
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: true

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 3000
            read-timeout: 5000

# ==========================================================
# Custom application settings
# ==========================================================
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-0123456789}
    access-token-minutes: 15
    refresh-token-days: 7
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}
  payment:
    enabled: ${PAYMENT_ENABLED:false}          # false = mock approval, no external call
    url: ${PAYMENT_SERVICE_URL:http://localhost:8090}
  seed:
    admin-enabled: true
    admin-email: ${ADMIN_EMAIL:admin@ott.com}
    admin-password: ${ADMIN_PASSWORD:Admin@12345}

# ==========================================================
# API docs + actuator
# ==========================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.ott: INFO

